<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: head"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container my-4">
    <h1 th:text="#{musclegroups.title}">All Muscle Groups</h1>
    <form class="row g-3 my-3">
        <div class="col-auto">
            <label th:text="#{musclegroups.nameContains}">Name Contains:</label>
            <input type="text" name="namePart" class="form-control" placeholder="Name filter" th:value="${namePart}"/>
        </div>
        <div class="col-auto">
            <label th:text="#{musclegroups.establishedAfterDate}">Established After Date:</label>
            <input type="date" name="afterDate" class="form-control" th:value="${afterDate}"/>
        </div>
        <div class="col-auto">
            <label th:text="#{musclegroups.minComplexityFactor}">Min Complexity Factor:</label>
            <input type="number" step="0.1" name="minFactor" class="form-control" th:value="${minFactor}"/>
        </div>
        <div class="col-auto align-self-end">
            <button class="btn btn-primary" type="submit" th:text="#{button.filter}">Filter</button>
        </div>
    </form>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        <div class="col" th:each="mg : ${musclegroups}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">
                        <a th:href="@{/musclegroups/details/{id}(id=${mg.id})}" th:text="${mg.name}">Muscle Group Name</a>
                    </h5>
                    <p class="card-text" th:text="${mg.description}">Description</p>
                    <p class="card-text">
                        <strong th:text="#{musclegroups.establishedOn}">Established On</strong>:
                        <span th:text="${mg.establishedOn}"></span>
                    </p>
                    <p class="card-text">
                        <strong th:text="#{musclegroups.complexityFactor}">Complexity Factor</strong>:
                        <span th:text="${mg.complexityFactor}"></span>
                    </p>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <a th:href="@{/musclegroups/details/{id}(id=${mg.id})}" class="btn btn-sm btn-outline-primary" th:text="#{button.details}">Details</a>
                    <form method="post" th:action="@{/musclegroups/delete/{id}(id=${mg.id})}">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
