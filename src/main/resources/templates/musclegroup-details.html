<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: head"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container my-4">
    <h1 th:text="${musclegroup.name}">Muscle Group Details</h1>
    <div class="card mb-3">
        <div class="card-body">

            <p>
                <strong>Description:</strong>
                <span th:text="${musclegroup.description}"></span>
            </p>

            <p>
                <strong th:text="#{musclegroups.establishedOn}">Established On</strong>:
                <span th:text="${musclegroup.establishedOn}"></span>
            </p>

            <p>
                <strong th:text="#{musclegroups.complexityFactor}">Complexity Factor</strong>:
                <span th:text="${musclegroup.complexityFactor}"></span>
            </p>

            <h5>Exercises:</h5>
            <ul>
                <li th:each="ex : ${musclegroup.exercises}">
                    <a th:href="@{/exercises/details/{id}(id=${ex.id})}"
                       th:text="${ex.name}">Exercise</a>
                </li>
            </ul>
        </div>
    </div>
    <a th:href="@{/musclegroups}" class="btn btn-secondary" th:text="#{button.back}">Back</a>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
