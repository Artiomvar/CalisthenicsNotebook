<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="fragments/head :: head"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container my-4">
    <h1 th:text="#{addExercise.title}">Add New Exercise</h1>
    <form method="post" th:action="@{/exercises/add}" th:object="${exercise}" class="row g-3 needs-validation" novalidate>
        <div class="col-md-6">
            <label class="form-label" th:for="*{name}" th:text="#{form.name}">Name</label>
            <input type="text" class="form-control" th:field="*{name}" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</div>
        </div>
        <div class="col-md-6">
            <label class="form-label" th:for="*{averageBurn}" th:text="#{form.averageBurn}">Average Burn</label>
            <input type="number" step="0.1" class="form-control" th:field="*{averageBurn}"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('averageBurn')}" th:errors="*{averageBurn}">Error</div>
        </div>
        <div class="col-md-6">
            <label class="form-label" th:for="*{createdOn}" th:text="#{form.createdOn}">Created On</label>
            <input type="date" class="form-control" th:field="*{createdOn}" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('createdOn')}" th:errors="*{createdOn}">Error</div>
        </div>
        <div class="col-md-6">
            <label class="form-label" th:for="*{imageFileName}" th:text="#{form.imageFileName}">Image File Name</label>
            <input type="text" class="form-control" th:field="*{imageFileName}" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('imageFileName')}" th:errors="*{imageFileName}">Error</div>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit" th:text="#{button.add}">Add</button>
        </div>
    </form>
</div>
<div th:replace="fragments/footer :: footer"></div>
<script th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
<script>
    (function () {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
    })();
</script>
</body>
</html>
